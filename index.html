      <h1>File Hasher</h1>
      <p>
        File Hasher computes file checksums entirely inside your browser: drop
        in a file and it works out the SHA-256, SHA-384, SHA-512, SHA-1 and
        MD5 digests without uploading anything anywhere. Paste in the hash a
        publisher gave you, or a full checksum list, and it marks each file as
        matching, mismatched or missing, and flags duplicate files that hash
        the same. Results export as plain text in the standard sha256sum
        format, CSV or JSON. There is no account, no server and no tracking.
        This page needs JavaScript enabled to hash a file.
